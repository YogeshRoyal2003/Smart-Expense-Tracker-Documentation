
openapi: 3.0.3

info:
  title: Smart Expense Tracker API
  description: >
    REST API documentation for the Smart Expense Tracker application.
    This specification describes the currently documented authentication
    and expense operations. The application has known security limitations
    and is intended for learning and portfolio purposes.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Authentication
    description: User registration and login operations
  - name: Expenses
    description: Expense management operations

paths:

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: >
        Registers a user account. The current implementation stores
        passwords as plain text and may include the password in the
        returned user object. Use fictional test credentials only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Alex
              email: alex@example.com
              password: ExamplePassword123
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                description: Saved user object. Inspect the actual response before documenting its fields.
        '400':
          description: Email address is already registered

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate a user
      description: >
        Authenticates a user and returns a JWT token as a plain response value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alex@example.com
              password: ExamplePassword123
      responses:
        '200':
          description: Login successful; JWT returned as a plain response value
          content:
            text/plain:
              schema:
                type: string
                description: JWT access token
        '401':
          description: Password does not match
        '404':
          description: User account was not found

  /api/expenses:
    get:
      tags:
        - Expenses
      summary: Retrieve expenses
      description: >
        Retrieves the expenses associated with the user identified
        by the supplied JWT.
      security:
        - bearerAuth: []
      # responses:
      #   '200':
      #     description: Expense list retrieved successfully
      #     content:
      #       application/json:
      #         schema:
      #           type: array
      #           items:
      #             $ref: '#/components/schemas/Expense'
      #   default:
      #     description: Request failed; inspect the actual server response
      
      responses:
        '200':
          description: Expense list retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseList'
              example:
                - id: 101
                  title: Groceries
                  amount: 850.50
                  category: Food
                  date: '2026-11-10'
                - id: 102
                  title: Bus ticket
                  amount: 45.00
                  category: Travel
                  date: '2026-11-10'
        default:
          description: Request failed; see the actual server response


    post:
      tags:
        - Expenses
      summary: Create an expense
      description: >
        Creates an expense associated with the user identified by the JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
            example:
              title: Groceries
              amount: 850.50
              category: Food
              date: '2026-11-10'
      # responses:
      #   '200':
      #     description: Expense created and saved record returned
      #     content:
      #       application/json:
      #         schema:
      #           $ref: '#/components/schemas/Expense'
      #   default:
      #     description: Request failed; inspect the actual server response
      
      responses:
        '200':
          description: Expense created and saved record returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
              example:
                id: 103
                title: Groceries
                amount: 850.50
                category: Food
                date: '2026-11-10'
        default:
          description: Request failed; see the actual server response


          



          
  /api/expenses/category/{category}:
    get:
      tags:
        - Expenses
      summary: Retrieve expenses by category
      description: >
        Retrieves expenses matching the supplied category.
        The current implementation does not enforce authentication
        or verify user ownership for this endpoint.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
          example: Food
      responses:
        default:
          description: Response from the category retrieval operation

  /api/expenses/monthly:
    get:
      tags:
        - Expenses
      summary: Retrieve monthly expense total
      description: >
        Calculates the expense total for the specified year and month.
        The current implementation does not enforce authentication.
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
          example: 2026
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          example: 11
      responses:
        default:
          description: Monthly expense total returned by the API

  /api/expenses/{id}:
    put:
      tags:
        - Expenses
      summary: Update an expense
      description: >
        Updates an expense using its ID and the supplied expense data.
        The current implementation does not enforce authentication
        or verify user ownership for this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
            example:
              title: Updated Groceries
              amount: 950.50
              category: Food
              date: '2026-11-10'
      responses:
        default:
          description: Response from the expense update operation

    delete:
      tags:
        - Expenses
      summary: Delete an expense
      description: >
        Deletes an expense using its ID.
        The current implementation does not enforce authentication
        or verify user ownership for this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        default:
          description: Response from the expense deletion operation

  /api/expenses/all:
    delete:
      tags:
        - Expenses
      summary: Delete all expenses for the authenticated user
      description: >
        Deletes all expenses associated with the user identified
        by the supplied JWT.
      security:
        - bearerAuth: []
      responses:
        default:
          description: Response from the delete-all operation

  /api/expenses/user/{userId}:
    get:
      tags:
        - Expenses
      summary: Retrieve expenses by user ID
      description: >
        Retrieves expenses associated with the specified user ID.
        The current implementation does not enforce authentication
        or verify user ownership for this endpoint.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        default:
          description: Response from the user expense retrieval operation

    delete:
      tags:
        - Expenses
      summary: Delete expenses by user ID
      description: >
        Deletes expenses associated with the specified user ID.
        The current implementation does not enforce authentication
        or verify user ownership for this endpoint.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        default:
          description: Response from the user expense deletion operation


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Alex
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          format: password
          example: ExamplePassword123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alex@example.com
        password:
          type: string
          format: password
          example: ExamplePassword123

    ExpenseRequest:
      type: object
      required:
        - title
        - amount
        - category
        - date
      properties:
        title:
          type: string
          example: Groceries
        amount:
          type: number
          format: double
          example: 850.50
        category:
          type: string
          example: Food
        date:
          type: string
          format: date
          example: '2026-11-10'

    Expense:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Groceries
        amount:
          type: number
          format: double
          example: 850.50
        category:
          type: string
          example: Food
        date:
          type: string
          format: date
          example: '2026-11-10'

          

    
    Expense:
      type: object
      description: An expense record. The example shows the documented core fields.
      properties:
        id:
          type: integer
          format: int64
          example: 101
        title:
          type: string
          example: Groceries
        amount:
          type: number
          format: double
          example: 850.50
        category:
          type: string
          example: Food
        date:
          type: string
          format: date
          example: '2026-11-10'
      additionalProperties: true

    ExpenseList:
      type: array
      items:
        $ref: '#/components/schemas/Expense'

