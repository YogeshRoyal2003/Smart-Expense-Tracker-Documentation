
site_name: Smart Expense Tracker Documentation
site_description: User and developer documentation for Smart Expense Tracker

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search
  - swagger-ui-tag:
      supportedSubmitMethods: []

nav:
  - Home: index.md
  - Product overview: product-overview.md
  - Getting started:
    - Installation: getting-started/installation.md
  - User Guide:
    - Dashboard: user-guide/dashboard.md
  - API Documentation:
    - API Overview: api/overview.md
    - Endpoint Inventory: api/endpoint-inventory.md
    - Data Models: api/data-models.md
    - Error Reference: api/errors.md
    - Interactive API Reference: api/reference.md
    - API Testing Report: api/testing-report.md
    - Request and Response Examples: api/request-reponse-examples.md
  - Release history: releases/index.md
